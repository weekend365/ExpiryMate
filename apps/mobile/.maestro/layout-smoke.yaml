appId: com.expirymate.mobile
name: Responsive layout smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/onboarding
- repeat:
    times: 4
    commands:
      - tapOn:
          id: onboarding-next-button
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/login
- openLink: expirymate://auth/forgot-password
- extendedWaitUntil:
    visible: "비밀번호를 잊었어요"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/forgot-password
- openLink: expirymate://auth/register
- extendedWaitUntil:
    visible: "이메일로 시작해요"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/auth-register
- openLink: expirymate://auth/reset-password?token=layout-e2e-token
- extendedWaitUntil:
    visible: "비밀번호 다시 정하기"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/reset-password
- openLink: expirymate://auth/verify-pending?email=layout-pending@example.com
- extendedWaitUntil:
    visible: "메일함을 열어볼까요?"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/verify-pending
- openLink: expirymate://auth/verify-email?token=layout-invalid-token
- extendedWaitUntil:
    visible: "앗, 잠시 문제가 생겼어요"
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/verify-email
- openLink: expirymate://auth/login
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 10000
- tapOn:
    id: login-email-local
- inputText: demo
- tapOn:
    id: login-email-domain-input
- inputText: gmail.com
- tapOn:
    id: login-password
- inputText: demo1234!
- hideKeyboard
- tapOn:
    id: login-submit-button
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/home
- tapOn:
    id: tab-inventory
- extendedWaitUntil:
    visible:
      id: inventory-screen
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/inventory
- tapOn: "서울우유 1L 내용을 고칠게요"
- extendedWaitUntil:
    visible:
      id: inventory-edit-screen
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/inventory-edit
- back
- extendedWaitUntil:
    visible:
      id: inventory-screen
    timeout: 10000
- tapOn:
    id: inventory-add-button
- assertVisible: "어떻게 넣을까요?"
- tapOn: "직접 입력할게요"
- extendedWaitUntil:
    visible:
      id: register-screen
    timeout: 10000
- tapOn:
    id: form-field-displayName
- inputText: 반응형 테스트 재료
- takeScreenshot: ${SCREENSHOT_DIR}/register-keyboard
- hideKeyboard
- back
- extendedWaitUntil:
    visible:
      id: inventory-screen
    timeout: 10000
- setPermissions:
    permissions:
      camera: deny
- tapOn:
    id: inventory-add-button
- tapOn: "바코드로 넣을래요"
- extendedWaitUntil:
    visible:
      id: scanner-screen
    timeout: 10000
- assertVisible: "카메라가 필요해요"
- takeScreenshot: ${SCREENSHOT_DIR}/scanner-permission-denied
- back
- setPermissions:
    permissions:
      camera: allow
- tapOn:
    id: inventory-add-button
- tapOn: "바코드로 넣을래요"
- extendedWaitUntil:
    visible:
      id: scanner-screen
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/scanner
- back
- tapOn:
    id: tab-recommendations
- extendedWaitUntil:
    visible:
      id: recommendations-screen
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/recommendations
- tapOn:
    id: recommendation-options-button
- assertVisible: "오늘은 어떤 요리로 할까요?"
- takeScreenshot: ${SCREENSHOT_DIR}/recommendation-options
- back
- tapOn:
    id: tab-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings
- openLink: expirymate://settings/subscription
- extendedWaitUntil:
    visible: "냉장고를 덜 버리는 습관"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/subscription
- openLink: expirymate://insights
- extendedWaitUntil:
    visible:
      id: insights-screen
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/insights
- openLink: expirymate://shopping
- extendedWaitUntil:
    visible:
      id: affiliate-shopping-screen
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/shopping
- openLink: expirymate://register-photo?from=home
- extendedWaitUntil:
    visible:
      id: photo-capture-screen
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/register-photo
- openLink: expirymate://cooking/layout-e2e-recommendation?dishIndex=0
- extendedWaitUntil:
    visible: "재료 준비"
    timeout: 20000
- takeScreenshot: ${SCREENSHOT_DIR}/cooking
- openLink: expirymate://privacy
- extendedWaitUntil:
    visible: "살펴보기"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/privacy
- openLink: expirymate://privacy/ai-data-notice
- extendedWaitUntil:
    visible: "추천할 때 전달되는 정보"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/ai-data-notice
- openLink: expirymate://privacy/account-delete
- extendedWaitUntil:
    visible: "바로 지워지는 것들"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/account-delete
- openLink: expirymate://settings/account
- extendedWaitUntil:
    visible: "내 정보"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-account
- openLink: expirymate://settings/notifications
- extendedWaitUntil:
    visible: "알림 받기"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-notifications
- openLink: expirymate://settings/recipe-preferences
- extendedWaitUntil:
    visible: "알레르기"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-recipe-preferences
- openLink: expirymate://settings/recommendation-credits
- extendedWaitUntil:
    visible: "필요한 만큼 충전하기"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-recommendation-credits
- openLink: expirymate://settings/spaces
- extendedWaitUntil:
    visible: "초대 코드로 참여할게요"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-spaces
- openLink: expirymate://settings/spaces/personal_layout-e2e-user
- extendedWaitUntil:
    visible: "구성원"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-space-detail
- openLink: expirymate://settings/storage-locations
- extendedWaitUntil:
    visible: "기본 위치"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-storage-locations
- openLink: expirymate://settings/support
- extendedWaitUntil:
    visible: "어떤 이야기인가요?"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/settings-support
- openLink: expirymate://spaces/invitations/code
- extendedWaitUntil:
    visible: "초대 코드로 참여"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/invitation-code
- openLink: expirymate://spaces/invitations/accept?token=layout-invitation-token
- extendedWaitUntil:
    visible: "함께 쓸 준비가 됐어요"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/invitation-accept
