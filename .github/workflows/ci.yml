name: CI

permissions:
  contents: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Env key parity
        run: pnpm validate:env-parity

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  migrate:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expirymate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expirymate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expirymate?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm --filter @expirymate/api exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm --filter @expirymate/api exec prisma generate

  build:
    runs-on: ubuntu-latest
    needs: quality
    env:
      GIT_SHA: ${{ github.sha }}
      APP_VERSION: 0.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @expirymate/shared build

      - name: Build API
        run: pnpm --filter @expirymate/api build

      - name: Build Admin (production env validation)
        run: pnpm --filter @expirymate/admin build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.expirymate.app
          PRIVACY_CONTACT_EMAIL: privacy@expirymate.app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Admin Docker fails without build args
        run: |
          set +e
          output="$(docker build \
            --progress=plain \
            --target build \
            -f apps/admin/Dockerfile \
            . 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected Admin Docker build to fail without build-args" >&2
            exit 1
          fi
          echo "$output" | grep -q "NEXT_PUBLIC_API_BASE_URL build-arg is required"

      - name: Admin Docker production build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: expirymate-admin:ci
          build-args: |
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_API_BASE_URL=https://api.expirymate.app
            PRIVACY_CONTACT_EMAIL=privacy@expirymate.app
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile-layout:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile:
          - small-three-button
          - modern-gesture
          - small-large-text
          - large-display-large-text
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expirymate_layout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expirymate_layout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expirymate_layout?schema=public
      NODE_ENV: development
      PORT: 4000
      AUTH_TOKEN_SECRET: layout-e2e-auth-token-secret-at-least-32-characters
      AUTH_ALLOW_DEV_FALLBACK: "false"
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4000
      EXPO_PUBLIC_OAUTH_REDIRECT_URI: http://10.0.2.2:4000/auth/oauth/callback
      ALLOW_MISSING_SCREENSHOT_BASELINES: ${{ github.event_name == 'push' && '1' || '0' }}
      SCREENSHOT_MAX_DIFF_RATIO: ${{ github.event_name == 'push' && '1' || (contains(github.event.pull_request.labels.*.name, 'approve-mobile-layout-change') && '1' || '0.005') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Locate latest main layout evidence
        id: main-layout-run
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let baseSupportsCombinedProfile = false;
            try {
              const manifest = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "apps/mobile/scripts/layout-screenshot-manifest.mjs",
                ref: context.payload.pull_request.base.sha,
              });
              const source = Buffer.from(manifest.data.content, "base64").toString("utf8");
              baseSupportsCombinedProfile = source.includes("large-display-large-text");
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput(
              "combined-profile-on-main",
              String(baseSupportsCombinedProfile),
            );
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: context.payload.pull_request.base.ref,
              event: "push",
              status: "success",
              per_page: 20,
            });
            const run = response.data.workflow_runs[0];
            if (!run) {
              core.setFailed("No successful main CI run is available as a mobile layout baseline.");
              return;
            }
            core.setOutput("run-id", String(run.id));

      - name: Download main layout evidence
        id: download-main-layout
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mobile-layout-${{ matrix.profile }}
          path: /tmp/mobile-layout-main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.main-layout-run.outputs.run-id }}

      - name: Stage main captures as strict baselines
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ steps.download-main-layout.outcome }}" != "success" ]; then
            if [ "${{ matrix.profile }}" = "large-display-large-text" ] && \
              [ "${{ steps.main-layout-run.outputs.combined-profile-on-main }}" != "true" ]; then
              echo "Bootstrapping the new large-display-large-text baseline from this run."
              echo "ALLOW_MISSING_SCREENSHOT_BASELINES=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Could not download the main layout baseline for ${{ matrix.profile }}." >&2
            exit 1
          fi
          capture_dir="$(find /tmp/mobile-layout-main -type f -name home.png -path "*/current/${{ matrix.profile }}/home.png" -printf '%h\n' | head -n 1)"
          if [ -z "$capture_dir" ]; then
            echo "The main artifact does not contain captures for ${{ matrix.profile }}." >&2
            exit 1
          fi
          baseline_dir="apps/mobile/e2e/screenshots/baseline/${{ matrix.profile }}"
          mkdir -p "$baseline_dir"
          cp "$capture_dir"/*.png "$baseline_dir"/

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prepare deterministic API data
        run: |
          pnpm --filter @expirymate/api exec prisma migrate deploy
          E2E_USER_PASSWORD='demo1234!' pnpm --filter @expirymate/api db:seed
          nohup pnpm --filter @expirymate/api exec nest start > /tmp/expirymate-layout-api.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:4000/ready && break
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/expirymate-layout-api.log
              exit 1
            fi
            sleep 1
          done

      - name: Build, run, and compare Android layout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            pnpm --filter @expirymate/mobile exec expo prebuild --platform android --clean --no-install
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' apps/mobile/android/app/src/main/AndroidManifest.xml
            pnpm --filter @expirymate/mobile exec expo run:android --variant release --no-bundler
            pnpm --filter @expirymate/mobile e2e:layout -- ${{ matrix.profile }}

      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-${{ matrix.profile }}
          path: |
            apps/mobile/e2e/results/${{ matrix.profile }}
            apps/mobile/e2e/screenshots/current/${{ matrix.profile }}
            apps/mobile/e2e/screenshots/baseline/${{ matrix.profile }}
            apps/mobile/e2e/screenshots/diff/${{ matrix.profile }}
            /tmp/expirymate-layout-api.log
          if-no-files-found: warn
