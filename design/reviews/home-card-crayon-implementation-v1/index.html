<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 크레파스 카드 · 앱 구현 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:15px/1.6 system-ui,sans-serif;color:#302e2c;background:#faf8f5}
main{max-width:1160px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{margin:0 0 16px}label{display:flex;gap:8px;align-items:center}
select{font:inherit;min-height:40px;padding:4px 8px;border:1px solid #b8bcb5;border-radius:6px;background:white}
.controls{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}.comparison{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
figure{margin:0;max-width:100%;flex-shrink:0}figcaption{font-weight:650;margin-bottom:8px}
iframe{display:block;box-sizing:content-box;border:1px solid #d6ccbc;background:#fff;max-width:100%}
.caption{color:#626a62;font-size:13px;margin-top:16px}@media(max-width:600px){body{padding:16px}}
</style>
<main>
<h1>홈 크레파스 카드 · 앱 구현 비교</h1>
<p>선택한 A안의 상태별 윤곽·색칠을 실제 앱 컴포넌트에 적용했습니다.</p>
<div class="controls">
<label>상태<select id="state"><option value="calm">일반 안내</option><option value="expired">기한 경고</option><option value="warning">임박 안내</option><option value="empty">첫 재료 안내</option><option value="error">불러오기 오류</option><option value="pending">추천 처리 중</option><option value="success">추천 완료</option><option value="loading">로딩</option></select></label>
<label>글자 배율<select id="scale"><option>1</option><option>1.3</option><option>2</option></select></label>
<label>화면 폭<select id="width"><option value="360">360</option><option value="320">320</option><option value="768">768</option></select></label>
</div>
<div class="comparison">
<figure><figcaption>기존 외관 · 장식 꺼짐</figcaption><iframe id="before" title="장식을 끈 홈 화면"></iframe></figure>
<figure><figcaption>A안 적용 · 실제 앱 SVG</figcaption><iframe id="after" title="앱 컴포넌트의 크레파스 카드"></iframe></figure>
</div>
<p class="caption">실제 HomeHero·SurfaceCard·CrayonCardDecoration을 React Native Web으로 렌더링합니다. 예시 데이터와 검토용 어댑터를 사용합니다. 기기 캡처·스크린리더 검증과 구분합니다. 말풍선·장고·상태색 면·기능 배치를 유지하며 큰 글자에서는 작은 색칠을 생략합니다.</p>
</main>
<script>
const controls=['state','scale','width'].map(id=>document.getElementById(id));
function update(){const[state,scale,width]=controls.map(el=>el.value);for(const[id,variant]of[['before','baseline'],['after','runtime']]){const frame=document.getElementById(id);frame.width=width;frame.height=Number(width)>=700?900:720;frame.src='/frame.html?'+new URLSearchParams({state,scale,variant});}}
controls.forEach(el=>el.addEventListener('change',update));update();
</script>
</html>
