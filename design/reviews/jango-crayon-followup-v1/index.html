<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>장고 크레파스 후속 적용 비교</title>
<style>
body{margin:0;background:#f5f2ed;color:#242c29;font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6}.controls{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}label{display:grid;gap:6px}select,button,input,textarea{font:inherit;padding:8px}.comparison{display:flex;gap:24px;justify-content:center;align-items:flex-start}.pane h2{font-size:16px}.pane iframe{display:block;border:1px solid #d4d9d4;border-radius:16px;height:640px;background:white}.pane{width:360px}.capture{margin-top:30px;border-top:1px solid #d4d9d4;padding-top:20px}.capture textarea{width:100%;height:64px;box-sizing:border-box}output{display:block;margin:10px 0}
</style>
<main><h1>작은 크레파스 기호 · 후속 적용</h1><p>빈 보관함의 첫 등록 안내와 저장 성공 후 완료 안내. 실제 공통 컴포넌트·문구·상태 선택을 예시 데이터로 비교합니다. 기기 캡처나 전체 화면 검증은 아닙니다.</p>
<div class="controls"><label>검토 상태<select id="scene">
<option value="inventory-empty">빈 보관함 · 첫 등록</option><option value="inventory-filtered">검색·필터 결과 없음</option><option value="inventory-loading">보관함 로딩</option><option value="inventory-error">보관함 최초 오류</option><option value="inventory-refresh-error">빈 보관함 새로고침 오류</option><option value="inventory-calm">재료가 있는 보관함</option><option value="registration-done">재료 등록 완료</option><option value="registration-multiple">여러 재료 등록 · 캐러셀</option><option value="registration-pending">저장 처리 중 · 검토용</option><option value="registration-error">저장 실패 · 검토용</option><option value="home-calm">기존 홈 · 일반</option><option value="home-warning">기존 홈 · 임박</option><option value="home-expired">기존 홈 · 기한 경고</option>
</select></label><label>화면 폭<select id="width"><option>360</option><option>320</option><option>768</option></select></label><label>글자 배율<select id="scale"><option>1</option><option>1.3</option><option>2</option></select></label></div>
<div class="comparison" id="comparison"><section class="pane"><h2>기존 · 후속 기호 끔</h2><iframe title="기존 컴포넌트"></iframe></section><section class="pane"><h2>적용 · 후속 기호 켬</h2><iframe title="크레파스 기호 적용"></iframe></section></div>
<p>배치·캐릭터·말풍선·행동을 유지합니다. 큰 글자에서는 작은 기호를 생략합니다. 홈 카드의 기존 크레파스 적용은 양쪽에 유지합니다.</p>
<form class="capture"><details><summary>검토 캡처 저장</summary><label>파일 이름<input name="name"></label><label>캡처 데이터<textarea name="image"></textarea></label><button>캡처 저장</button></details></form><output aria-live="polite"></output></main>
<script>
const scene=document.querySelector('#scene'),width=document.querySelector('#width'),scale=document.querySelector('#scale');
function update(){document.querySelectorAll('.pane').forEach((pane,i)=>{pane.style.width=width.value+'px';pane.querySelector('iframe').style.width=width.value+'px';pane.querySelector('iframe').src='/frame.html?scene='+scene.value+'&scale='+scale.value+'&variant='+(i?'runtime':'baseline')})}
[scene,width,scale].forEach(input=>input.addEventListener('change',update));update();
document.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const f=new FormData(event.target);const r=await fetch('/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),image:f.get('image')})});document.querySelector('output').textContent=await r.text()});
</script></html>
