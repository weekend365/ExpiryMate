<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANGO v10 / 2번 뭐해? 수정</title><style>@font-face{font-family:Jua;src:url(fonts/Jua-Regular.ttf)}*{box-sizing:border-box}body{margin:0;background:#f1f3ed;color:#294735;font-family:Jua,system-ui}main{max-width:1480px;margin:auto;padding:40px 28px}h1{font-size:42px;margin:12px 0}p{line-height:1.7;color:#607466}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a,button,select{font:inherit;color:inherit;background:#fff;border:1px solid #d4dfd3;border-radius:10px;padding:12px;text-decoration:none}button,select{cursor:pointer}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--w,760px)),1fr));gap:18px}.card{background:#fff;border-radius:20px;overflow:hidden}.card h2{font-size:20px;margin:20px}.stage{display:flex;justify-content:center;gap:12px;padding:16px;overflow:auto}.stage.dark{background:#293a31}.version{text-align:center}.version img{display:block;width:var(--size,360px);height:var(--size,360px)}.version small{display:block;margin:10px;color:#74907e}.asset{display:block;margin:16px}.note{font-size:14px}footer{margin-top:40px;color:#738976}</style><main><small>JANGO CHARACTER KIT / VERSION 10</small><h1>입 표현의 기준은<br>jango-idle.</h1><p>2번의 검은 테두리와 분홍색 채움 입을 jango-idle MASTER의 단일 U자 입선으로 바꿨습니다.<br>기존 ‘뭐해?’ 대사는 유지했습니다. 선택하신 2번 1안을 포함한 나머지 31종은 그대로입니다.</p><nav><a href="stickers/02.png" download="02.png">수정한 2번 받기</a><a href="preview-light.png">전체 32종 보기</a><a href="../README.md">제작 파일 안내</a><a href="02-comparison-light.png">MASTER와 비교</a></nav><div class="controls"><select id="filter"><option value="edited">수정한 2번</option><option value="all">전체 32종</option></select><button id="compare" aria-pressed="true">v9와 비교</button><label>크기 <select id="size"><option>120</option><option selected>360</option></select></label><label>배경 <select id="bg"><option value="light">밝게</option><option value="dark">어둡게</option></select></label><span id="count"></span></div><div id="grid" class="grid"></div><p class="note">2번의 ‘뭐해?’ 대사는 기존 글자 레이어를 그대로 사용했습니다.</p><footer><a href="README.txt">파일 안내</a> <a href="QA-report.json">확인 기록</a> <a href="preview-120.png">작은 크기로 32종 보기</a></footer></main><script>
const items=[{"number": 1, "title": "안녕!"}, {"number": 2, "title": "뭐해?"}, {"number": 3, "title": "잘 자"}, {"number": 4, "title": "지금 가!"}, {"number": 5, "title": "좋아!"}, {"number": 6, "title": "고마워"}, {"number": 7, "title": "최고야"}, {"number": 8, "title": "싫어"}, {"number": 9, "title": "모르겠어"}, {"number": 10, "title": "앗, 놓쳤다"}, {"number": 11, "title": "삐짐"}, {"number": 12, "title": "뭐해?"}, {"number": 13, "title": "울컥"}, {"number": 14, "title": "ㅋㅋㅋ"}, {"number": 15, "title": "헉!"}, {"number": 16, "title": "잠깐만"}, {"number": 17, "title": "집중 중"}, {"number": 18, "title": "휴… 끝났다!"}, {"number": 19, "title": "수고했어"}, {"number": 20, "title": "온몸으로 응원"}, {"number": 21, "title": "밥 먹었어?"}, {"number": 22, "title": "배고파"}, {"number": 23, "title": "솔깃 / 군침"}, {"number": 24, "title": "보고 싶어"}, {"number": 25, "title": "사랑해"}, {"number": 26, "title": "안아줘"}, {"number": 27, "title": "기다릴게"}, {"number": 28, "title": "미안해"}, {"number": 29, "title": "괜찮아"}, {"number": 30, "title": "응, 알겠어"}, {"number": 31, "title": "같이 먹자"}, {"number": 32, "title": "짝짝짝"}];let compare=true;const grid=document.getElementById('grid'),filter=document.getElementById('filter'),size=document.getElementById('size'),bg=document.getElementById('bg');
function render(){grid.replaceChildren();const shown=items.filter(x=>filter.value==='all'||x.number===2);grid.style.setProperty('--w',(Number(size.value)*(compare?2:1)+60)+'px');for(const x of shown){const id=String(x.number).padStart(2,'0'),now=`stickers/${id}.png`,old=x.number===2?'comparison/v9-02.png':now,card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=`${id} / ${x.title}`;card.append(h);const stage=document.createElement('div');stage.className='stage '+bg.value;stage.style.setProperty('--size',size.value+'px');for(const [url,label]of(compare?[[old,'v9'],[now,x.number===2?'v10 / 갸우뚱':'v10 / 유지']]:[[now,'v10']])){const v=document.createElement('div');v.className='version';const im=document.createElement('img');im.src=url;im.alt=x.title+' '+label;const cap=document.createElement('small');cap.textContent=label;v.append(im,cap);stage.append(v)}card.append(stage);const a=document.createElement('a');a.className='asset';a.href=now;a.download=id+'.png';a.textContent='PNG 다운로드';card.append(a);grid.append(card)}document.getElementById('count').textContent=shown.length+'종'}
document.getElementById('compare').addEventListener('click',e=>{compare=!compare;e.currentTarget.setAttribute('aria-pressed',String(compare));render()});for(const el of[filter,size,bg])el.addEventListener('change',render);render();
</script></html>
